server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback para index.html — necessário pro React Router (SPA)
    # funcionar com refresh em rotas como /posts/123 ou /admin
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}